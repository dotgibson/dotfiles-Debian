# dotfiles-Debian/wsl/wsl.conf  →  /etc/wsl.conf   (installed by bootstrap.sh;
# __WSL_USER__ is substituted with the invoking user at install time)
# ──────────────────────────────────────────────────────────────────────────────
# This is the DISTRO-side config — it lives inside the WSL distro and configures
# how that distro boots. The GLOBAL WSL2 settings (memory, CPU, and the
# all-important networkingMode) live on the WINDOWS side in
# %UserProfile%\.wslconfig — see wsl/windows.wslconfig.example. Editing the wrong
# one of these two files is the single most common WSL configuration mistake:
# putting networkingMode here does nothing at all, silently.
#
# Applies to any Debian-family distro running under WSL2. Kali is the usual case
# in this fleet — dotfiles-Offense stacks its Role layer on top of a WSL2 Kali —
# but nothing here is Kali-specific.
# ──────────────────────────────────────────────────────────────────────────────

[boot]
systemd=true

[user]
default=__WSL_USER__

[interop]
enabled=true
appendWindowsPath=true

[network]
generateResolvConf=true
generateHosts=true
