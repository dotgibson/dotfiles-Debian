# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names Ubuntu's container +
# the deps bootstrap needs. See dotfiles-core/.github/workflows/bootstrap-test.yml.
name: bootstrap

# NO path filters, deliberately — `test / lint` and `test / links-only` are REQUIRED
# status checks on main. A filtered-out required check never reports, so GitHub blocks the
# PR indefinitely waiting for a result that will never arrive. See the same note in
# lint.yml. The links-only run is a couple of minutes; the deadlock is forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # TWO JOBS, NOT A MATRIX, and the difference is load-bearing. `test / lint` and
  # `test / links-only` are REQUIRED status checks on main. Adding `strategy.matrix`
  # to this job would rename them to `test (ubuntu:24.04) / lint` and friends, and a
  # required check whose name no longer reports blocks every PR forever — the exact
  # deadlock the path-filter note above warns about, arrived at from a different
  # direction. A second job adds new check names and leaves the required ones alone.
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v4
    with:
      image: ubuntu:24.04
      prep: "apt-get update -qq && apt-get install -y -q --no-install-recommends bash zsh"
      # Run provision() for real, with the package managers and downloaders stubbed
      # (dotgibson/dotfiles-core#575). links-only returns BEFORE provision() is entered, so
      # until this the whole first half of this bootstrap — apt, the 32-package base stack,
      # fourteen SHA-pinned installs, both vendor repos, carapace, unattended-upgrades — was
      # executed by no gate anywhere. Proven shim-clean on both images before enabling
      # (dotgibson/dotfiles-Debian#11).
      provision_stub: true

  # Kali is a first-class target since dotfiles-Offense shed its OS-native half, and
  # it is the one target whose archive is ROLLING — so it exercises a genuinely
  # different code path: install/packages.txt's `# only:kali` tier, and the
  # apt-supplies-it-so-the-pinned-fetch-no-ops behaviour that depends on.
  #
  # Not required on main, deliberately. A rolling archive can drop a package
  # mid-migration through no fault of this repo, and a hard gate on that would red
  # unrelated PRs. Treat a red here as a to-do, the same way packages.yml's advisory
  # lanes are read.
  test-kali:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v4
    with:
      image: kalilinux/kali-rolling
      prep: "apt-get update -qq && apt-get install -y -q --no-install-recommends bash zsh"
      # Kali too: it exercises the `# only:kali` tier of install/packages.txt, which is a
      # genuinely different path through provision(). Same advisory posture as this job's
      # other legs — a rolling archive can break through no fault of this repo.
      provision_stub: true
