# .github/workflows/packages.yml
# ──────────────────────────────────────────────────────────────────────────────
# Does every name in install/packages.txt still resolve — at a version Core can use —
# on the releases this repo claims to support?
#
# That manifest carries hand-maintained availability claims ("noble still ships sd,
# which Fedora retired", "yq-go is sid-only"). Nothing mechanically checked any of it:
# the only auditor was the weekly /os-package-availability Claude routine, which is
# INERT without a CLAUDE_CODE_OAUTH_TOKEN secret. A dropped or renamed package would
# therefore surface on someone's fresh install months later — and bootstrap.sh's
# apt_install retries package-by-package, so it fails SOFTLY, by design.
#
# This is the deterministic half. The logic lives in test/check-packages.sh (so
# `make packages-check` reproduces CI exactly), and it does two things:
#
#   1. RESOLUTION via `apt-get install --simulate` — apt's real resolver, not
#      `apt-cache`, which either exits 0 on unknown names (policy) or 100 on
#      installable virtual ones (show). The bulk pass additionally proves the whole
#      set is CO-INSTALLABLE, which no per-name probe can.
#   2. VERSION FLOORS declared as `# min:X.Y.Z` in the manifest. This is the half
#      Fedora's equivalent has no analogue for, and on a frozen LTS it is the half
#      that matters: noble resolves `neovim` (0.9.5) and `tree-sitter-cli` (0.20.8)
#      perfectly happily, and both are far below what Core needs. A resolution-only
#      gate would call that box healthy.
#
# NOT a required status check: it is matrix-heavy and path-filtered, and a required
# check that never runs would deadlock every unrelated PR. Same reasoning as the note
# in dotfiles-Fedora's copy.
# ──────────────────────────────────────────────────────────────────────────────
name: packages

on:
  pull_request:
    paths:
      - 'install/packages.txt'
      - 'test/check-packages.sh'
      # The distro tier decides WHICH names this workflow resolves, so a change to it
      # changes the answer as surely as editing the manifest does. Omitting it would
      # be the same silent incompleteness a path filter always fails by: nothing
      # errors, the workflow simply does not run and the PR looks clean.
      - 'scripts/pkg-filter.sh'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths:
      - 'install/packages.txt'
      - 'test/check-packages.sh'
      # The distro tier decides WHICH names this workflow resolves, so a change to it
      # changes the answer as surely as editing the manifest does. Omitting it would
      # be the same silent incompleteness a path filter always fails by: nothing
      # errors, the workflow simply does not run and the PR looks clean.
      - 'scripts/pkg-filter.sh'
      - '.github/workflows/packages.yml'
  schedule:
    # Tue 07:00 UTC — an unused fleet slot (Fedora packages is Sat 07:00, Offense's is
    # Wed 07:00), so the fleet never draws on the same runner window.
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: apt resolve (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the scheduled run on forks: it would burn their minutes proving something
    # only this repo acts on.
    if: github.event_name != 'schedule' || github.repository_owner == 'dotgibson'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared target. A name that does not resolve here is a broken box
          # today, so this BLOCKS.
          - image: "ubuntu:24.04"
            label: "ubuntu 24.04 (target)"
            blocking: true
          # The repo is NAMED dotfiles-Debian, so Debian stable is a promise, not a
          # nice-to-have. This lane goes red exactly when someone adds an Ubuntu-only
          # name or a PPA — which is the regression the name cares about. It already
          # caught one: software-properties-common does not exist in trixie, so it
          # lives in bootstrap.sh's ID=ubuntu branch rather than in the manifest.
          - image: "debian:trixie"
            label: "debian trixie"
            blocking: true
          # The inverse of Fedora's rawhide lane. Fedora's warns about tools
          # DISAPPEARING; this one warns about tools ARRIVING — when starship, dust,
          # procs, xh, glow, gum or lazygit land in a newer Ubuntu, that is the signal
          # to promote them out of bootstrap.sh's pinned-asset set and back into apt.
          # Advisory: upstream catching up must never red a PR.
          - image: "ubuntu:26.04"
            label: "ubuntu 26.04 (early warning)"
            blocking: false
          # Kali: the rolling target, and the only lane that exercises the
          # `# only:kali` tier at all. The other three resolve the untiered 32 names;
          # this one resolves 47 and checks the two floors that ride the tier
          # (neovim >= 0.12.0, tree-sitter-cli >= 0.26.1) — the floors that make
          # tiering those packages in safe rather than a silent downgrade.
          #
          # ADVISORY. Kali tracks sid, where a package can vanish for days mid-
          # migration through no fault of this repo; a hard gate would red unrelated
          # PRs. Same reasoning as the 26.04 lane, opposite cause.
          #
          # Safe to add as a matrix entry, unlike bootstrap.yml: the check name here
          # is `apt resolve (<label>)`, so a new lane adds a NAME rather than renaming
          # the existing ones, and none of these are required checks anyway.
          - image: "kalilinux/kali-rolling"
            label: "kali rolling"
            blocking: false
    container:
      image: ${{ matrix.image }}
    # bash, EXPLICITLY. Inside a `container:` job the default shell is `sh`, not the
    # `bash -e {0}` a runs-on job gets — and every step here is bash: `set -uo pipefail`,
    # ${PIPESTATUS[0]}, arrays. Under dash the very first line dies with
    # `set: Illegal option -o pipefail` and the job exits 2 before a single package is
    # resolved, so the lane reported "failure" while having checked nothing at all.
    #
    # This workflow had never once passed: its only two runs — a scheduled one on main
    # and the first PR run — both died here. It is path-filtered on install/packages.txt,
    # so it fires rarely, and a red that only ever appears on a file nobody had touched
    # in a while is a red nobody reads.
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      # The base images carry no git, and actions/checkout falls back to a REST
      # tarball without it — which works, but then the repo is not a git checkout and
      # blib_read_pkgs' callers behave differently. Install it first, as Kali does.
      - name: Install checkout prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -q --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve every package name, and check declared version floors
        id: resolve
        # NO continue-on-error, deliberately, and this was a real trap. It does not merely
        # keep the job green — it rewrites the STEP's recorded conclusion to `success` too.
        # An advisory lane that had genuinely failed reported success at every level the
        # API exposes: check run, job, and step. The exit-2 existed only in the log text,
        # which is the one place nobody looks at on a green tick. A lane whose failures are
        # invisible is worse than no lane, because it manufactures confidence.
        #
        # `exit 0` would have been no better — a chosen-zero reads as success identically.
        #
        # So the failure is now REAL at every level: the step fails, the job fails, the
        # check goes red. What makes an advisory lane advisory is that NONE of these are
        # required status checks on main, so a red one is loud without blocking a merge.
        # That is the honest split: relax the GATING, never the REPORTING.
        run: |
          set -uo pipefail
          # check-packages.sh sources core/lib/{ux,bootstrap-lib}.sh. The vendored
          # core/ subtree is part of this checkout, so nothing else is needed.
          bash test/check-packages.sh install/packages.txt | tee /tmp/pkgreport.txt
          rc=${PIPESTATUS[0]}

          # The summary is what a reader sees without opening the job, so it carries the
          # verdict in its HEADING rather than burying it in a code block.
          if [ "$rc" -eq 0 ]; then
            head="✅ ${{ matrix.label }} — all names resolve"
          elif [ "${{ matrix.blocking }}" = "true" ]; then
            head="❌ ${{ matrix.label }} — BLOCKING lane failed (exit $rc)"
          else
            head="⚠️ ${{ matrix.label }} — advisory lane failed (exit $rc), not a required check"
          fi
          {
            echo "### $head"
            echo
            echo '```'
            cat /tmp/pkgreport.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # An annotation too, so it surfaces on the PR's Checks tab without opening the
          # summary. ::error:: even on an advisory lane: the finding IS an error — a name
          # in the manifest does not exist on a target the manifest claims. Whether it
          # blocks a merge is branch protection's call, not this message's.
          if [ "$rc" -ne 0 ]; then
            if [ "${{ matrix.blocking }}" = "true" ]; then
              echo "::error::${{ matrix.label }}: package manifest does not resolve (exit $rc) — blocking lane"
            else
              echo "::error::${{ matrix.label }}: package manifest does not resolve (exit $rc) — advisory lane, red but not merge-blocking. A rolling archive can drop a name mid-migration; confirm before acting."
            fi
          fi
          exit "$rc"

      # The inverse claim: assert the tools bootstrap.sh installs out-of-band STILL are
      # not in apt. When one of them appears, this is the nudge to move it back into
      # install/packages.txt and drop its pin from install/tool-versions.env — which is
      # how the out-of-band set stays as small as the archive allows.
      - name: Are any out-of-band tools packaged now?
        continue-on-error: true
        run: |
          set -uo pipefail
          found=0

          # Group 1 — ABSENT from the target archive. For these, merely resolving is
          # the promotion signal.
          for p in starship lazygit atuin mise uv du-dust xh procs difftastic \
                   glow gum yq-go carapace; do
            if apt-get install --simulate --no-install-recommends "$p" >/dev/null 2>&1; then
              echo "::notice::$p now resolves on ${{ matrix.label }} — consider promoting it into install/packages.txt and dropping its pin from install/tool-versions.env"
              found=1
            fi
          done

          # Group 2 — PRESENT but too old, which is a different question. These two
          # resolve on every lane already, so "does it resolve" would fire a useless
          # notice on every run forever. The real signal is whether the candidate has
          # finally crossed the floor Core requires. dpkg --compare-versions is the
          # only correct comparator here: these versions carry epochs and +dfsg/ubuntu
          # suffixes that sort wrongly under sort -V.
          check_floor() { # <package> <floor> <why>
            cand="$(apt-cache policy "$1" 2>/dev/null | awk '/Candidate:/{print $2}')"
            [ -n "$cand" ] && [ "$cand" != "(none)" ] || return 0
            if dpkg --compare-versions "$cand" ge "$2"; then
              echo "::notice::$1 is now $cand on ${{ matrix.label }}, which clears the $2 floor ($3) — it can move from bootstrap.sh into install/packages.txt with a '# min:$2' comment"
              found=1
            else
              echo "$1: $cand (still below the $2 floor — stays out-of-band)"
            fi
          }
          check_floor neovim 0.12 "nvim-treesitter main hard-requires it"
          check_floor tree-sitter-cli 0.26.1 "core/PORTING-MATRIX.md footnote 5"

          [ "$found" -eq 0 ] && echo "nothing to promote on ${{ matrix.label }}."
          exit 0
